name: Production smoke

# Every read endpoint against production, decoded with its own schema (tools/smoke/prod.ts, HAL-3468).
# Needs the MAILYARD_SMOKE_KEY secret; without it the run says so and stops.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Needs a key
        id: key
        env:
          KEY: ${{ secrets.MAILYARD_SMOKE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::MAILYARD_SMOKE_KEY isn't set, so the smoke test can't run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.present == 'true'
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        if: steps.key.outputs.present == 'true'
      - run: bun run smoke:prod --report smoke-report.json
        if: steps.key.outputs.present == 'true'
        env:
          MAILYARD_ADMIN_KEY: ${{ secrets.MAILYARD_SMOKE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: smoke-report
          path: smoke-report.json
